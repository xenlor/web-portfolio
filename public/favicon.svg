<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="xenlor.dev">
  <!--
    Favicon: un prompt de terminal (>_) sobre el morado de la marca.
    Es el mismo lenguaje que el logo de la cabecera, que ya es un icono de
    terminal, y el color es el theme-color del sitio (#7c3aed).
    Sin texto pequeno a proposito: a 16 px una letra no se lee, una forma si.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#g)"/>

  <!-- El chevron y el guion bajo, con las puntas redondeadas para que no se
       vean dentadas al reducir el icono. -->
  <g fill="none" stroke="#ffffff" stroke-width="6"
     stroke-linecap="round" stroke-linejoin="round">
    <polyline points="18,22 30,32 18,42"/>
    <line x1="36" y1="43" x2="48" y2="43"/>
  </g>
</svg>
