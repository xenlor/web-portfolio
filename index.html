<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- El SVG primero: escala a cualquier tamano sin pesar. Los PNG quedan de
         reserva para navegadores que no lo admiten. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" />

    <!-- El titulo empieza por el nombre, no por el dominio: quien busca
         "Esteban Castillo" tiene que reconocerse en el primer vistazo. El alias
         va entre parentesis para cubrir tambien las busquedas por "xenlor".
         Google recorta sobre los 60 caracteres; este mide 53. -->
    <title>Esteban Castillo (xenlor) | Sistemas y Ciberseguridad</title>
    <!-- La descripcion se recorta sobre los 160; esta mide 163, asi que el
         corte, si llega, cae en la ultima palabra y no se pierde nada. -->
    <meta name="description" content="Portfolio de Esteban Castillo, técnico de sistemas y ciberseguridad en Burgos. Microsoft 365, Active Directory, redes y seguridad perimetral, con automatización." />
    <meta name="author" content="Esteban Castillo Loren" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph: lo que se ve al pegar el enlace en WhatsApp o LinkedIn -->
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://xenlor.dev/" />
    <meta property="og:title" content="Esteban Castillo (xenlor) | Sistemas y Ciberseguridad" />
    <meta property="og:description" content="Portfolio de Esteban Castillo, técnico de sistemas y ciberseguridad en Burgos. Microsoft 365, Active Directory, redes y seguridad perimetral, con automatización." />
    <meta property="og:image" content="https://xenlor.dev/og-image.png" />
    <meta property="og:image:alt" content="Esteban Castillo, técnico de sistemas y ciberseguridad" />
    <meta property="og:locale" content="es_ES" />
    <!-- El nombre que Google muestra encima del resultado. Con "xenlor.dev"
         salia el dominio, que no dice quien eres. -->
    <meta property="og:site_name" content="Esteban Castillo" />
    <meta property="profile:first_name" content="Esteban" />
    <meta property="profile:last_name" content="Castillo Loren" />
    <meta property="profile:username" content="xenlor" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:url" content="https://xenlor.dev/" />
    <meta name="twitter:title" content="Esteban Castillo (xenlor) | Sistemas y Ciberseguridad" />
    <meta name="twitter:description" content="Portfolio de Esteban Castillo, técnico de sistemas y ciberseguridad en Burgos." />
    <meta name="twitter:image" content="https://xenlor.dev/og-image.png" />

    <link rel="canonical" href="https://xenlor.dev/" />

    <!-- Datos estructurados. Es lo que permite a Google entender que esto es
         una PERSONA con un nombre, un oficio y unos perfiles, en vez de una
         pagina cualquiera. Sin esto, buscar "Esteban Castillo" no relaciona
         este sitio con la persona. -->
    <!-- WebSite: es de donde Google saca el nombre del sitio que aparece encima
         del titulo en los resultados. Sin esto usa el dominio, "xenlor.dev". -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Esteban Castillo",
      "alternateName": ["xenlor", "xenlor.dev"],
      "url": "https://xenlor.dev/",
      "inLanguage": "es-ES",
      "author": { "@id": "https://xenlor.dev/#persona" }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "@id": "https://xenlor.dev/#persona",
      "name": "Esteban Castillo Loren",
      "alternateName": "xenlor",
      "url": "https://xenlor.dev/",
      "image": "https://xenlor.dev/og-image.png",
      "email": "contacto@xenlor.dev",
      "jobTitle": "Técnico de Sistemas y Ciberseguridad",
      "description": "Técnico de sistemas con especialización en ciberseguridad y orientación a la automatización.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Burgos",
        "addressCountry": "ES"
      },
      "worksFor": {
        "@type": "Organization",
        "name": "Norsol Eléctrica, S.L."
      },
      "alumniOf": [
        { "@type": "EducationalOrganization", "name": "CIFP Juan de Colonia" },
        { "@type": "CollegeOrUniversity", "name": "Universidad de Talca" }
      ],
      "knowsAbout": [
        "Administración de sistemas",
        "Ciberseguridad",
        "Microsoft 365",
        "Active Directory",
        "Redes y seguridad perimetral",
        "Virtualización",
        "Automatización"
      ],
      "sameAs": [
        "https://github.com/xenlor",
        "https://www.linkedin.com/in/esteban-castillo-loren-595652303/"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!--
      El contenido de la pagina lo pinta React, asi que el HTML que se sirve
      llega sin texto. Google ejecuta JavaScript, pero en una segunda pasada
      que puede tardar dias; otros rastreadores no lo ejecutan nunca. Esto
      garantiza que quien lea el HTML en crudo encuentre al menos quien es y
      a que se dedica. Solo se muestra si el JavaScript no llega a ejecutarse.
    -->
    <noscript>
      <h1>Esteban Castillo Loren, técnico de sistemas y ciberseguridad</h1>
      <p>
        Portfolio de Esteban Castillo Loren (xenlor), técnico de sistemas con
        especialización en ciberseguridad, en Burgos, España. Administro la
        infraestructura de una empresa: Microsoft 365, Active Directory,
        servidores Windows y Linux, virtualización, red perimetral con FortiGate
        y CRM/ERP con Dynamics 365. Automatizo con PowerShell, Python y n8n.
      </p>

      <h2>Experiencia</h2>
      <p>
        Soporte y administración de sistemas IT en Norsol Eléctrica desde junio
        de 2024: identidad y accesos con MFA, hardening y gestión de
        vulnerabilidades, EDR corporativo, continuidad de negocio y
        concienciación en ciberseguridad.
      </p>

      <h2>Formación</h2>
      <p>
        Curso de Especialización en Ciberseguridad (CETI) y Técnico Superior en
        Administración de Sistemas Informáticos en Red (ASIR), ambos en el CIFP
        Juan de Colonia de Burgos.
      </p>

      <h2>Proyectos</h2>
      <ul>
        <li>IDS para IoT con machine learning sobre Raspberry Pi</li>
        <li>Infraestructura en contenedores con acceso remoto por VPN</li>
        <li>Homelab en Proxmox con ocho contenedores y copias cifradas</li>
        <li>Clasificador de correo corporativo con n8n y OpenAI</li>
        <li>Herramientas de automatización para Linux en Bash</li>
      </ul>

      <h2>Contacto</h2>
      <p>
        <a href="mailto:contacto@xenlor.dev">contacto@xenlor.dev</a> ·
        <a href="https://github.com/xenlor">GitHub</a> ·
        <a href="https://www.linkedin.com/in/esteban-castillo-loren-595652303/">LinkedIn</a>
      </p>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
